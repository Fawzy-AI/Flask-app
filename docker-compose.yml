services:
  app:
    build: .
    image: flask-devops-app:latest
    container_name: flask_app
    restart: unless-stopped
    expose:
      - "5000"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
